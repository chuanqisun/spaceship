<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Designer Profile</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" />
    <style>
      /* Layout: a three-row grid (1fr / auto / 1fr). Instruments in the top corners, one paragraph dead centre, date + links in the bottom corners. A canvas starfield sits behind everything. Single dark world, on purpose. */
      :root {
        --bg: #000;
        --ink-1: #f2f1f4;
        --ink-2: #d9d8de;
        --ink-3: #b2b1b8;
        --ink-4: #8c8b93;
        --iris-1: #cdb9ff;
        --iris-2: #9fe6ff;
        --iris-3: #ffc2e6;
        --warm: #ffd6aa;
        --cool: #c4d2ff;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --e-ui: cubic-bezier(0.22, 1, 0.36, 1);
        --e-out: cubic-bezier(0.16, 1, 0.3, 1);
        --e-inout: cubic-bezier(0.65, 0, 0.35, 1);
        --e-spring: linear(
          0,
          0.06,
          0.197,
          0.365,
          0.531,
          0.679,
          0.8,
          0.892,
          0.957,
          0.999,
          1.024,
          1.036,
          1.038,
          1.036,
          1.03,
          1.024,
          1.018,
          1.012,
          1.007,
          1.004,
          1.002,
          1,
          0.999,
          0.999,
          1
        );
        --cue: 1;
        color-scheme: dark;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink-1);
        font-family: var(--font);
        font-size: 20px;
        font-optical-sizing: auto;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .site {
        isolation: isolate;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 1fr auto 1fr;
        gap: 40px;
        min-height: 100svh;
        padding-block: clamp(16px, 2.5vw, 36px);
        padding-left: max(clamp(16px, 2.5vw, 36px), env(safe-area-inset-left, 0px));
        padding-right: max(clamp(16px, 2.5vw, 36px), env(safe-area-inset-right, 0px));
      }
      .sparkles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }

      /* Top corners */
      .top-corners {
        display: flex;
        justify-content: space-between;
        align-items: center;
        align-self: start;
        min-height: 28px;
      }
      .sparkle-button {
        width: 44px;
        height: 44px;
        margin: -8px;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        cursor: pointer;
        border-radius: 50%;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .sparkle-button:focus-visible {
        outline: 1px solid var(--iris-1);
        outline-offset: 2px;
      }
      .button-star {
        display: block;
        overflow: visible;
        transition: scale 0.65s var(--e-spring);
      }
      .sparkle-button:active .button-star {
        scale: 0.88;
        transition: scale 90ms ease-out;
      }
      .button-star line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.25px;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .button-star .iris {
        opacity: 0;
        transition: opacity 0.32s var(--e-ui);
      }
      .button-star .iris line {
        stroke: url(#iris);
      }
      .spokes,
      .diag {
        transform-box: view-box;
        transform-origin: 16px 16px;
      }
      .diag {
        transition: transform 0.52s var(--e-ui);
      }
      .spokes {
        transition: rotate 1.4s var(--e-out);
      }
      .sparkle-button:focus-visible .iris {
        opacity: 1;
      }
      @media (hover: hover) {
        .sparkle-button:hover .iris {
          opacity: 1;
        }
      }

      .instruments {
        display: flex;
        align-items: center;
      }
      .clock,
      .bottom-corners {
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.012em;
      }
      .clock {
        position: relative;
        color: var(--ink-2);
      }
      .clock time {
        display: inline-flex;
        font-variant-numeric: tabular-nums;
      }
      .cell {
        position: relative;
        display: inline-block;
        height: 16px;
        clip-path: inset(2.5px 0 3px);
      }
      .cell.s {
        color: var(--ink-4);
      }
      .glyph {
        display: block;
        animation: tick-in 0.38s cubic-bezier(0.3, 0, 0.1, 1);
      }
      .glyph.out {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation-name: tick-out;
      }
      @keyframes tick-in {
        from {
          opacity: 0;
          transform: translateY(0.8em);
        }
      }
      @keyframes tick-out {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(-0.8em);
        }
      }
      .engraving {
        position: absolute;
        top: 0;
        right: 100%;
        margin-right: 14px;
        white-space: nowrap;
        color: var(--ink-4);
        letter-spacing: 0.02em;
        font-feature-settings: "case";
        clip-path: inset(0 0 0 100%);
        opacity: 0;
        pointer-events: none;
        transition:
          clip-path 0.56s var(--e-ui),
          opacity 0.56s var(--e-ui);
      }
      @media (hover: hover) {
        .clock:hover .engraving {
          clip-path: inset(0);
          opacity: 1;
        }
      }

      .sound-toggle {
        width: 32px;
        height: 32px;
        margin: -8px -8px -8px 6px;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        cursor: pointer;
        border-radius: 6px;
        transition: color 0.4s var(--e-ui);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .sound-toggle svg {
        display: block;
        overflow: visible;
        transition:
          filter 0.4s var(--e-ui),
          scale 0.65s var(--e-spring);
      }
      .sound-toggle path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.25px;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .sound-toggle .wave-iris {
        stroke: url(#sound-iris);
        opacity: 0;
        transition: opacity 0.32s var(--e-ui);
      }
      .sound-toggle .amp,
      .sound-toggle .breath {
        transform-box: view-box;
        transform-origin: 8px 8px;
      }
      .sound-toggle .amp {
        transition: scale 0.65s var(--e-spring);
      }
      .sound-toggle .wave {
        animation: sound-travel 4.8s linear infinite paused;
      }
      .sound-toggle .breath {
        animation: sound-breathe 6.4s var(--e-inout) infinite alternate paused;
      }
      .sound-toggle[data-state="on"] .wave,
      .sound-toggle[data-state="on"] .breath {
        animation-play-state: running;
      }
      .sound-toggle[aria-pressed="false"] {
        color: var(--ink-4);
      }
      .sound-toggle[aria-pressed="false"] .amp {
        scale: 1 0.001;
        transition: scale 0.42s var(--e-ui);
      }
      .sound-toggle:active svg {
        scale: 0.88;
        transition: scale 90ms ease-out;
      }
      .sound-toggle:focus-visible {
        outline: 1px solid var(--iris-1);
        outline-offset: 2px;
      }
      .sound-toggle:focus-visible .wave-iris {
        opacity: 1;
      }
      .sound-toggle:focus-visible svg {
        filter: drop-shadow(0 0 6px rgba(205, 185, 255, 0.6));
      }
      @media (hover: hover) {
        .sound-toggle:hover .wave-iris {
          opacity: 1;
        }
        .sound-toggle:hover svg {
          filter: drop-shadow(0 0 6px rgba(205, 185, 255, 0.6));
        }
      }
      @keyframes sound-travel {
        to {
          translate: -14px;
        }
      }
      @keyframes sound-breathe {
        from {
          scale: 1 0.55;
        }
      }
      @media (pointer: coarse) {
        .sound-toggle {
          width: 44px;
          height: 44px;
          margin: -14px -14px -14px 0;
        }
      }

      /* Centre paragraph */
      .intro {
        place-self: center;
        width: min(100%, 540px);
        padding: 24px 0;
        position: relative;
      }
      .about-copy {
        position: relative;
        margin: 0;
        cursor: default;
        font-size: 20px;
        line-height: 28px;
        font-weight: 380;
        letter-spacing: -0.008em;
        font-variation-settings: "opsz" 28;
        color: var(--ink-3);
        text-wrap: pretty;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
      }
      .about-copy h1 {
        font: inherit;
        margin: 0;
        display: inline;
        color: var(--ink-1);
        font-weight: 460;
      }
      .w {
        white-space: nowrap;
      }
      .about-copy .w {
        --star: color-mix(in oklab, var(--warm) calc((1 - var(--arm, 0.5)) * 100%), var(--cool));
        color: color-mix(in oklab, color-mix(in oklab, var(--word-ink) 84%, var(--star)) calc((1 - var(--lit, 0) * 0.55) * 100%), #fff);
        text-shadow:
          0 1px 12px rgba(0, 0, 0, 0.9),
          0 0 calc(4px + var(--lit, 0) * 14px) color-mix(in oklab, var(--star) calc(var(--lit, 0) * 70%), transparent);
        transition:
          color 0.7s var(--e-ui),
          text-shadow 0.7s var(--e-ui);
      }
      .about-copy .opening .w {
        --word-ink: var(--ink-1);
      }
      .about-copy .rest .w {
        --word-ink: var(--ink-3);
      }

      .about-copy a {
        background-image: linear-gradient(currentColor, currentColor);
        background-repeat: no-repeat;
        background-position: 100% 100%;
        background-size: 0% 1px;
        transition:
          background-size 0.56s var(--e-out),
          text-decoration-color 0.2s,
          color 0.24s var(--e-ui);
      }
      .about-copy a {
        color: var(--ink-1);
        text-decoration: underline 1px rgba(242, 241, 244, 0.24);
        text-underline-offset: 0.26em;
        padding-bottom: 0.07em;
      }
      .about-copy a:focus-visible {
        outline: none;
        color: #fff;
        background-position-x: 0;
        background-size: 100% 1px;
        text-decoration-color: transparent;
      }
      .mark {
        cursor: default;
      }
      @media (hover: hover) {
        .about-copy a:hover {
          color: #fff;
          background-position-x: 0;
          background-size: 100% 1px;
          text-decoration-color: transparent;
        }
      }

      /* Bottom corners */
      .bottom-corners {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        align-self: end;
        gap: 24px;
      }
      .current-date {
        margin: 0;
        display: grid;
        white-space: nowrap;
        color: var(--ink-3);
        font-variant-numeric: proportional-nums lining-nums;
      }
      .current-date span {
        color: var(--ink-4);
      }
      /* Zoom instrument: mouse and trackpad users; phones pinch instead */
      .zoom {
        display: flex;
        align-items: center;
        gap: 2px;
        margin: 0 0 -6px;
        color: var(--ink-2);
      }
      .zoom button {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        cursor: pointer;
        color: var(--ink-2);
        transition: color 0.24s var(--e-ui);
      }
      .zoom svg {
        width: 14px;
        height: 14px;
        overflow: visible;
        transition:
          filter 0.4s var(--e-ui),
          scale 0.65s var(--e-spring);
      }
      .zoom path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.25px;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .zoom button:active svg {
        scale: 0.85;
        transition: scale 90ms ease-out;
      }
      .zoom button:focus-visible {
        outline: 1px solid var(--iris-1);
        outline-offset: 1px;
        color: var(--ink-1);
      }
      .zoom-level {
        min-width: 3.4em;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        color: var(--ink-4);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.012em;
      }
      @media (hover: hover) {
        .zoom button:hover {
          color: var(--ink-1);
        }
        .zoom button:hover svg {
          filter: drop-shadow(0 0 6px rgba(205, 185, 255, 0.6));
        }
      }
      @media (pointer: coarse) {
        .zoom {
          display: none;
        }
      }
      html.cue:not(.cue-done) .zoom {
        animation: settle-up calc(0.6s * var(--cue)) var(--e-ui) calc(1.2s * var(--cue)) both;
      }

      /* Intro cue: letters condense out of starlight */
      html.cue:not(.cue-done) .base line {
        stroke-dasharray: 1;
        animation: spoke calc(0.56s * var(--cue)) var(--e-inout) calc((80ms + var(--i) * 45ms) * var(--cue)) both;
      }
      html.cue:not(.cue-done) .about-copy .c {
        animation: condense calc(1.25s * var(--cue)) var(--e-out) var(--d, 0s) both;
      }
      html.cue:not(.cue-done) .clock {
        animation: settle-down calc(0.6s * var(--cue)) var(--e-ui) calc(1.1s * var(--cue)) both;
      }
      html.cue:not(.cue-done) .sound-toggle {
        animation: settle-down calc(0.6s * var(--cue)) var(--e-ui) calc(1.16s * var(--cue)) both;
      }
      html.cue:not(.cue-done) .current-date {
        animation: settle-up calc(0.6s * var(--cue)) var(--e-ui) calc(1.16s * var(--cue)) both;
      }
      @keyframes spoke {
        from {
          stroke-dashoffset: 1px;
        }
      }
      @keyframes condense {
        0% {
          opacity: 0;
          color: transparent;
          text-shadow: 0 0 26px rgba(255, 238, 220, 0);
        }
        28% {
          opacity: 1;
          color: transparent;
          text-shadow: 0 0 11px rgba(255, 238, 220, 0.95);
        }
        58% {
          color: #fff;
          text-shadow: 0 0 7px rgba(214, 204, 255, 0.7);
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes settle-down {
        from {
          opacity: 0;
          translate: 0 -4px;
        }
      }
      @keyframes settle-up {
        from {
          opacity: 0;
          translate: 0 4px;
        }
      }

      @media (max-width: 640px) {
        .site {
          gap: 32px;
        }
        .intro {
          width: min(100%, 440px);
          padding: 12px 8px;
        }
        .bottom-corners {
          gap: 12px;
        }
      }
      @media (max-width: 480px) {
        .engraving {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html.cue .about-copy .c,
        html.cue .base line,
        html.cue .clock,
        html.cue .sound-toggle,
        html.cue .current-date {
          animation: none !important;
        }
        .glyph {
          animation: none;
        }
        .glyph.out {
          display: none;
        }
      }
    </style>

    <main class="site">
      <header class="top-corners">
        <button class="sparkle-button" id="spin" type="button" aria-label="Spin the galaxy" title="Spin the galaxy">
          <svg class="button-star" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="iris" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32">
                <stop offset="0" stop-color="#cdb9ff" />
                <stop offset=".33" stop-color="#9fe6ff" />
                <stop offset=".66" stop-color="#ffc2e6" />
                <stop offset="1" stop-color="#cdb9ff" />
              </linearGradient>
            </defs>
            <g class="spokes">
              <g class="base">
                <line x1="17.399" y1="12.792" x2="21.144" y2="4.205" pathLength="1" style="--i: 0" />
                <line x1="19.208" y1="17.399" x2="27.795" y2="21.144" pathLength="1" style="--i: 2" />
                <line x1="14.601" y1="19.208" x2="10.856" y2="27.795" pathLength="1" style="--i: 4" />
                <line x1="12.792" y1="14.601" x2="4.205" y2="10.856" pathLength="1" style="--i: 6" />
                <g class="diag">
                  <line x1="19.258" y1="14.721" x2="28.187" y2="11.215" pathLength="1" style="--i: 1" />
                  <line x1="17.279" y1="19.258" x2="20.785" y2="28.187" pathLength="1" style="--i: 3" />
                  <line x1="12.742" y1="17.279" x2="3.813" y2="20.785" pathLength="1" style="--i: 5" />
                  <line x1="14.721" y1="12.742" x2="11.215" y2="3.813" pathLength="1" style="--i: 7" />
                </g>
              </g>
              <g class="iris">
                <line x1="17.399" y1="12.792" x2="21.144" y2="4.205" />
                <line x1="19.208" y1="17.399" x2="27.795" y2="21.144" />
                <line x1="14.601" y1="19.208" x2="10.856" y2="27.795" />
                <line x1="12.792" y1="14.601" x2="4.205" y2="10.856" />
                <g class="diag">
                  <line x1="19.258" y1="14.721" x2="28.187" y2="11.215" />
                  <line x1="17.279" y1="19.258" x2="20.785" y2="28.187" />
                  <line x1="12.742" y1="17.279" x2="3.813" y2="20.785" />
                  <line x1="14.721" y1="12.742" x2="11.215" y2="3.813" />
                </g>
              </g>
            </g>
          </svg>
        </button>

        <div class="instruments">
          <div class="clock">
            <span class="engraving" id="engraving" aria-hidden="true">Sydney · 33°52′S 151°13′E</span>
            <time id="clock"><span class="sr-only" id="clock-sr"></span></time>
          </div>
          <button class="sound-toggle" id="sound" type="button" aria-label="Sound" title="Sound" aria-pressed="true" data-state="idle">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="sound-feather" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="16" y2="0">
                  <stop offset="0" stop-color="#fff" stop-opacity="0" />
                  <stop offset=".22" stop-color="#fff" />
                  <stop offset=".78" stop-color="#fff" />
                  <stop offset="1" stop-color="#fff" stop-opacity="0" />
                </linearGradient>
                <mask id="sound-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
                  <rect width="16" height="16" fill="url(#sound-feather)" />
                </mask>
                <linearGradient id="sound-iris" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="14" y2="0" spreadMethod="repeat">
                  <stop offset="0" stop-color="#cdb9ff" />
                  <stop offset=".35" stop-color="#9fe6ff" />
                  <stop offset=".7" stop-color="#ffc2e6" />
                  <stop offset="1" stop-color="#cdb9ff" />
                </linearGradient>
              </defs>
              <g mask="url(#sound-mask)">
                <g class="amp">
                  <g class="breath">
                    <path class="wave" d="M-6 8q1.75-4 3.5 0t3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0" />
                    <path class="wave wave-iris" d="M-6 8q1.75-4 3.5 0t3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0 3.5 0" />
                  </g>
                </g>
              </g>
            </svg>
          </button>
        </div>
      </header>

      <article class="intro" aria-label="The night sky">
        <div class="about-copy" id="copy">
          <h1 class="opening" data-split>
            Long before <span class="mark" data-mark="world">maps</span>, <span class="mark" data-mark="explorer">explorers</span> found their way by the
            <span class="mark" data-mark="compass">North Star</span>, the one light in the night sky that barely moves.
          </h1>
          <span class="rest" data-split><span class="mark" data-mark="earth">Earth</span> has just one <span class="mark" data-mark="moon">moon</span>.</span>
        </div>
      </article>

      <footer class="bottom-corners">

              ])
            }
            for (var e = 0; e < WORLD.extra.length; e += 3) {
              if (WORLD.extra[e + 2] === homeCountry) pts.push([WORLD.extra[e] / C, WORLD.extra[e + 1] / R, true])
            }
            out = { pts: pts, aspect: C / R, maxH: 420, even: true }
          } else if (name === "explorer") {
            out = { pts: sampleCanvas(200, 240, drawExplorer, 3, 1100), aspect: 200 / 240, maxH: 330 }
          } else {
            out = {
              pts: sampleCanvas(
                160,
                160,
                function (b) {
                  drawShape(b, name, 160)
                },
                3,
                340,
              ),
              aspect: 1,
              maxH: 230,
            }
          }
          shapeCache[name] = out
          return out
        }

        function bodySize() {

        function seeded(n) {
          return function () {
            n = (n + 0x6d2b79f5) | 0
            var t = Math.imul(n ^ (n >>> 15), 1 | n)
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t

        function paintMoon() {
          var R = Math.round(bodySize() * 0.75)
          moon.R = R
          var S = R * 2,

          c.width = c.height = Math.round(S * DPR)
          var b = c.getContext("2d")
          b.scale(DPR, DPR)

            b.beginPath()
            b.arc(R, R, R, 0, TAU)

            var edge = b.createRadialGradient(R, R, R * 0.94, R, R, R)

            edge.addColorStop(1, "rgba(0,0,0,0)")
            b.fillStyle = edge

            [0.42, 0.72, 0.11],
            [0.62, 0.66, 0.08],

              y = m[1] * S,

            var gr = b.createRadialGradient(x, y, 0, x, y, r)
            gr.addColorStop(0, "rgba(45,6,2,.42)")
            gr.addColorStop(0.7, "rgba(45,6,2,.22)")
            gr.addColorStop(1, "rgba(45,6,2,0)")
            b.fillStyle = gr

            b.ellipse(x, y, r, r * (0.75 + rnd() * 0.3), rnd() * Math.PI, 0, TAU)
            b.fill()
          })

          for (var i = 0; i < 26; i++) {

            b.arc(cx, cy, cr, 0, TAU)
            b.fill()
            b.strokeStyle = "rgba(255,170,120," + (0.025 + rnd() * 0.04) + ")"
            b.lineWidth = Math.max(0.6, cr * 0.25)

          b.arc(tx, ty, R * 0.035, 0, TAU)

          // words near the pointer catch the starlight
          if (!coarse) {
            for (var k = 0; k < wordBoxes.length; k++) {
              var wb = wordBoxes[k]
              var target = ptr.active ? smooth(1 - Math.hypot(wb.x - ptr.x, (wb.y - ptr.y) * 1.4) / 150) : 0
              var nl = wb.lit + (target - wb.lit) * (1 - Math.exp(-dt * 8))
              if (Math.abs(nl - wb.lit) > 0.004) {
                wb.lit = nl
                wb.w.style.setProperty("--lit", nl.toFixed(3))
              }
            }
          }
          requestAnimationFrame(frame)
        }
        resize()
        requestAnimationFrame(frame)
      })()
    </script>
  </body>
</html>
