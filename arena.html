<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spaceship — arena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --ink: #fff;
        --ink-2: rgb(255 255 255 / 0.64);
        --ink-3: rgb(255 255 255 / 0.4);
        --ink-4: rgb(255 255 255 / 0.22);
        --ink-5: rgb(255 255 255 / 0.1);
        --hot: #ff5a1f;
        --hot-wash: rgb(255 90 31 / 0.38);
        --hair: 1px;
        --text-size: 11px;
        --line: 18px;
        --gap: 8px;
        --padding: 16px;
        --tray-height: 18px;
        --knob: 14px;
        scrollbar-gutter: stable;
        background: var(--bg);
        color: var(--ink);
        font:
          var(--text-size) "JetBrains Mono Variable",
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header#arena-head {
        display: flex;
        align-items: center;
        gap: var(--gap);
        padding: var(--gap) var(--padding);
        border-bottom: var(--hair) solid var(--ink-5);
      }
      header#arena-head h1 {
        font-size: inherit;
        font-weight: normal;
        margin: 0;
      }
      header#arena-head .spacer {
        flex: 1;
      }
      #capacity-note {
        color: var(--ink-3);
      }
      main#panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 28ch), 1fr));
        grid-auto-rows: minmax(0, 1fr);
        gap: var(--gap);
        padding: var(--gap);
        align-content: start;
      }
      section.pane {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: var(--hair) solid var(--ink-5);
        border-radius: 4px;
        padding: var(--gap);
        gap: var(--gap);
      }
      section.pane:focus-within {
        border-color: var(--ink-3);
      }
      section.pane[data-focused] {
        border-color: var(--hot);
      }
      .pane-head {
        display: flex;
        align-items: baseline;
        gap: var(--gap);
        min-height: calc(var(--line) * 2);
      }
      .pane-label {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: var(--ink-2);
        cursor: pointer;
        text-align: left;
      }
      .pane-status {
        margin-left: auto;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .pane-status[data-generating] {
        color: var(--hot);
      }
      .pane-text {
        flex: 1;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: var(--line);
        min-height: calc(var(--line) * 8);
      }
      .pane-error {
        margin: 0;
        color: var(--hot);
        min-height: var(--line);
        white-space: pre-wrap;
      }
      .pane-foot {
        display: flex;
        align-items: center;
        gap: var(--gap);
      }
      button.knob {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--knob);
        height: var(--knob);
        border-radius: 50%;
        border: var(--hair) solid var(--ink-3);
        background: var(--bg);
        padding: 0;
        cursor: grab;
      }
      button.knob:active {
        cursor: grabbing;
      }
      .pane-remove {
        margin-left: auto;
      }
      footer#steering {
        display: flex;
        align-items: center;
        gap: var(--gap);
        flex-wrap: wrap;
        padding: var(--gap) var(--padding);
        border-top: var(--hair) solid var(--ink-5);
      }
      footer#steering input[type="text"] {
        flex: 1;
        min-width: 12ch;
        background: var(--bg);
        color: var(--ink);
        border: var(--hair) solid var(--ink-4);
        font: inherit;
        padding: 2px var(--gap);
      }
      footer#steering [data-dimensions] {
        display: contents;
      }
      .dim-rows {
        display: contents;
      }
      .dim-row {
        display: inline-flex;
        align-items: center;
        gap: var(--gap);
        border: var(--hair) solid var(--ink-5);
        border-radius: 4px;
        padding: 0 var(--gap);
      }
      .dim-row input[type="range"] {
        width: 8ch;
      }
      .dim-row select,
      [data-dimensions] > select {
        background: var(--bg);
        color: var(--ink);
        border: var(--hair) solid var(--ink-4);
        font: inherit;
      }
      .dim-row output {
        color: var(--ink-3);
        min-width: 12ch;
      }
      dialog {
        background: var(--bg);
        color: var(--ink);
        border: var(--hair) solid var(--ink-4);
        border-radius: 4px;
        font: inherit;
        max-width: min(40rem, calc(100vw - 2 * var(--gap)));
        max-height: calc(100dvh - 2 * var(--gap));
        overflow: auto;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.6);
      }
      dialog h2 {
        font-size: inherit;
        font-weight: normal;
        margin: 0 0 var(--gap);
      }
      dialog label {
        display: block;
        margin-block: var(--gap);
      }
      dialog input[type="text"],
      dialog input[type="password"],
      dialog input[type="search"] {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        border: var(--hair) solid var(--ink-4);
        font: inherit;
        padding: 2px var(--gap);
      }
      .picker-tabs {
        display: flex;
        gap: var(--gap);
        margin-block: var(--gap);
      }
      .picker-tabs button[aria-pressed="true"] {
        color: var(--hot);
      }
      .picker-list {
        max-height: 40dvh;
        overflow-y: auto;
        border: var(--hair) solid var(--ink-5);
      }
      .picker-list button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--ink);
        font: inherit;
        padding: var(--gap);
        cursor: pointer;
      }
      .picker-list button:hover,
      .picker-list button:focus-visible {
        background: var(--ink-5);
      }
      .picker-list .meta {
        color: var(--ink-3);
      }
      .picker-stale {
        color: var(--ink-3);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--gap);
        margin-top: var(--gap);
      }
      @media (pointer: coarse) {
        :root {
          --knob: 24px;
          --text-size: 12px;
        }
        .pane-foot button,
        footer#steering button,
        header#arena-head button {
          min-width: 32px;
          min-height: 32px;
        }
      }
    </style>
  </head>
  <body>
    <header id="arena-head">
      <h1>arena</h1>
      <span id="capacity-note" hidden></span>
      <span class="spacer"></span>
      <button id="add-pane" type="button">+ pane</button>
      <button id="keys-open" type="button">keys</button>
      <a id="back-link" href="./">← story</a>
    </header>
    <main id="panes" aria-label="model comparison panes"></main>
    <template id="pane-template">
      <section class="pane">
        <header class="pane-head">
          <button class="pane-label" type="button"></button>
          <span class="pane-status"></span>
        </header>
        <div class="pane-text"></div>
        <p class="pane-error" role="alert"></p>
        <footer class="pane-foot">
          <button class="knob" type="button" aria-label="caret knob: drag to regenerate from here"></button>
          <button class="pane-remove" type="button" aria-label="remove pane">×</button>
        </footer>
      </section>
    </template>
    <footer id="steering" aria-label="shared steering">
      <input id="steer-phrase" type="text" placeholder="key phrase" autocomplete="off" />
      <span data-dimensions></span>
      <button id="steer-apply" type="button">apply</button>
      <button id="steer-target" type="button" aria-pressed="true" title="steer all panes or the focused one">all panes</button>
    </footer>
    <dialog id="model-picker" aria-labelledby="model-picker-title" closedby="closerequest">
      <h2 id="model-picker-title">choose a model</h2>
      <div class="picker-tabs" role="tablist" aria-label="provider">
        <button type="button" data-provider="cerebras" role="tab" aria-pressed="false">cerebras</button>
        <button type="button" data-provider="openrouter" role="tab" aria-pressed="false">openrouter</button>
        <button type="button" data-provider="sim" role="tab" aria-pressed="false">sim</button>
      </div>
      <input id="picker-search" type="search" placeholder="search models" autocomplete="off" />
      <p class="picker-stale" id="picker-stale" hidden>showing cached list</p>
      <p class="picker-stale" id="picker-key-note" hidden></p>
      <div class="picker-list" id="picker-list" role="listbox" aria-label="models"></div>
      <form id="picker-manual" autocomplete="off">
        <label
          >or enter a model id
          <input
            name="model"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-1p-ignore
            data-lpignore="true"
            data-bwignore
            data-form-type="other"
        /></label>
        <p class="actions">
          <button type="button" command="close" commandfor="model-picker">cancel</button>
          <button type="submit">use model</button>
        </p>
      </form>
    </dialog>
    <dialog id="keys" aria-labelledby="keys-title" closedby="closerequest">
      <form method="dialog" autocomplete="off">
        <h2 id="keys-title">api keys</h2>
        <p>Keys stay in this browser's local storage and are sent only to their own provider.</p>
        <label
          >cerebras
          <input
            name="cerebras"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-1p-ignore
            data-lpignore="true"
            data-bwignore
            data-form-type="other"
        /></label>
        <label
          >openrouter
          <input
            name="openrouter"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-1p-ignore
            data-lpignore="true"
            data-bwignore
            data-form-type="other"
        /></label>
        <p class="actions">
          <button type="button" command="close" commandfor="keys">done</button>
          <button value="save">save</button>
        </p>
      </form>
    </dialog>
    <script type="module" src="/src/arena/main.ts"></script>
  </body>
</html>
