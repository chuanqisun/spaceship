name: Bug report
description: Something in the simulator or live mode does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the steps to reproduce. Never paste API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Simulator, Live]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
